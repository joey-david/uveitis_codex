device: cuda

preprocess:
  dataset_name: uwf700
  global_size: 1024
  stats_erode_px: 4
  norm_method: reinhard_lab_ref
  norm_ref_stats_path: preproc/ref/regular_fundus_color_stats.json
  roi:
    method: sam2_prompted
    method_by_dataset:
      uwf700: sam2_prompted
    downsample_max_side: 768
    sat_threshold: 18
    crop_pad_px: 12
    sam2:
      checkpoint: models/sam2/sam2.1_hiera_base_plus.pt
      model_cfg: configs/sam2.1/sam2.1_hiera_b+.yaml
      device: cuda
      fallback_to_threshold: true
      multimask_output: true
      points_norm:
        - [0.50, 0.50, 1]
        - [0.35, 0.50, 1]
        - [0.65, 0.50, 1]
        - [0.50, 0.35, 1]
        - [0.50, 0.65, 1]
        - [0.03, 0.03, 0]
        - [0.97, 0.03, 0]
        - [0.03, 0.97, 0]
        - [0.97, 0.97, 0]
        - [0.50, 0.02, 0]
        - [0.50, 0.98, 0]
      open_kernel: 7
      close_kernel: 19
      min_area_ratio: 0.10
      max_area_ratio: 0.98
      max_border_touch_ratio: 0.55

branches:
  core: configs/experiments/main9_iterC_detcalib_infer.yaml
  oedeme: configs/experiments/main9_iterJ_infer.yaml
  focus: configs/experiments/main9_iterO_overfit_focusfg_infer.yaml

profiles:
  best_overfit:
    display_name: UWF Overfit Specialist
    description: Highest in-domain accuracy on current UWF pipeline.
    default_branch: core
    class_branch:
      oedeme_papillaire: oedeme
      foyer_choroidien: focus
      granulome_choroidien: focus
  balanced:
    display_name: Balanced Clinical
    description: Less aggressive profile with narrower class overrides.
    default_branch: core
    class_branch:
      oedeme_papillaire: oedeme
      granulome_choroidien: focus
